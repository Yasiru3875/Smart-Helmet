org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
flutter.experimental.impeller=false
kotlin.incremental=false
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true

# Network settings for restricted connections
org.gradle.networktimeout=100000
systemProp.http.connectionTimeout=180000
systemProp.http.socketTimeout=180000
systemProp.https.protocols=TLSv1.2,TLSv1.3
systemProp.http.keepAlive=false

